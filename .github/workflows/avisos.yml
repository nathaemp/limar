name: Avisos da Marinha
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/avisos.py", ".github/workflows/avisos.yml"]
permissions:
  contents: write
concurrency: avisos
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/avisos.py avisos.json
      - run: |
          git config user.name "limamar-bot"
          git config user.email "nathaemp@users.noreply.github.com"
          git add avisos.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "Avisos da Marinha atualizados"
          git pull --rebase -q && git push
